# Python dependencies and settings for ruff, mypy and pytest (managed with uv).
# Add dependencies with: uv add <package>

[project]
name = "panda"
version = "0.1.0"
description = "Agentic audit of a health insurer's provider directory"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
markers = [
    "live: calls a real external service (skipped by default)",
    "seed: reads the real seed CSVs (skipped when they are absent, e.g. in CI)",
]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
